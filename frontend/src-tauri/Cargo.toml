[package]
name = "cafeflow"
version = "1.0.0"
description = "CAFELOW — Smart Billing. Smarter Cafe. Professional POS & Billing Desktop Application"
authors = ["CAFELOW Team"]
edition = "2021"

[lib]
name = "cafeflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
